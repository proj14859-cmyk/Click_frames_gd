name: Build

on:
  workflow_dispatch:
  push:

jobs:
  timing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test timing engine and persistence
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined tests/timing.cpp -o /tmp/timing-tests
          /tmp/timing-tests
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined tests/pack.cpp -o /tmp/pack-tests
          /tmp/pack-tests
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined tests/storage.cpp -o /tmp/storage-tests
          /tmp/storage-tests
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined tests/analysis.cpp -o /tmp/analysis-tests
          /tmp/analysis-tests
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined tests/editor.cpp -o /tmp/editor-tests
          /tmp/editor-tests
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined tests/bundle.cpp -o /tmp/bundle-tests
          /tmp/bundle-tests
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined tests/retained_dictionary.cpp -o /tmp/retained-dictionary-tests
          /tmp/retained-dictionary-tests
          g++ -std=c++20 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined tests/precision.cpp -o /tmp/precision-tests
          /tmp/precision-tests
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined tests/scan_support.cpp -o /tmp/scan-support-tests
          /tmp/scan-support-tests
          g++ -std=c++20 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined tests/v105.cpp -o /tmp/v105-tests
          /tmp/v105-tests
          g++ -std=c++20 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined tests/v106.cpp -o /tmp/v106-tests
          /tmp/v106-tests
      - name: Release algorithm benchmarks (not GD runtime)
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror -pthread tests/benchmark.cpp -o /tmp/scan-benchmark
          /tmp/scan-benchmark
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Windows,   os: windows-latest }
          - { name: Android32, os: ubuntu-latest, target: Android32 }
          - { name: Android64, os: ubuntu-latest, target: Android64 }
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-alpha.1
          combine: true
          target: ${{ matrix.config.target }}

  package:
    needs: [build, timing-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: click_frames_gd
          path: ${{ steps.build.outputs.build-output }}
