name: Build

on:
  workflow_dispatch:
  push:

jobs:
  timing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test timing engine and persistence
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined tests/timing.cpp -o /tmp/timing-tests
          /tmp/timing-tests
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined tests/pack.cpp -o /tmp/pack-tests
          /tmp/pack-tests
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined tests/storage.cpp -o /tmp/storage-tests
          /tmp/storage-tests
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined tests/analysis.cpp -o /tmp/analysis-tests
          /tmp/analysis-tests
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Windows,   os: windows-latest }
          - { name: Android32, os: ubuntu-latest, target: Android32 }
          - { name: Android64, os: ubuntu-latest, target: Android64 }
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    needs: [build, timing-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: click_frames_gd
          path: ${{ steps.build.outputs.build-output }}
